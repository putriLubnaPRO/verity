<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity AI Console - Fish Audio Edition</title>
    <style>
        :root {
            --bg-main: #090d16;
            --panel: #161f32;
            --yellow: #facc15;
            --cyan: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-main); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { background: #030712; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        nav h2 { color: var(--yellow); font-size: 1.3rem; }
        nav a { color: var(--cyan); text-decoration: none; font-weight: bold; }

        .main-container { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 1.2rem; padding: 1.2rem; max-width: 1400px; width: 100%; margin: 0 auto; }

        /* Left Panel / Visualizer */
        .sidebar { background: var(--panel); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border); }
        .avatar-container { position: relative; width: 170px; height: 170px; margin: 1.5rem 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--yellow); transition: all 0.3s; }
        .avatar-img.speaking { animation: pulse 0.5s infinite alternate; box-shadow: 0 0 30px rgba(250, 204, 21, 0.7); }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .config-box { width: 100%; margin-top: auto; background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .config-box h4 { color: var(--cyan); font-size: 0.85rem; margin-bottom: 0.6rem; text-transform: uppercase; }
        .config-box label { font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 0.4rem; }
        .config-box input { width: 100%; padding: 0.4rem; background: #1e293b; border: 1px solid var(--border); color: #fff; border-radius: 4px; font-size: 0.8rem; }

        /* Right Panel / Custom Chat */
        .chat-area { background: var(--panel); border-radius: 12px; display: flex; flex-direction: column; border: 1px solid var(--border); overflow: hidden; }
        .chat-header { background: #0f172a; padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--yellow); display: flex; justify-content: space-between; }
        .messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; height: 400px; }
        .msg { max-width: 75%; padding: 0.8rem 1.2rem; border-radius: 10px; line-height: 1.4; font-size: 0.95rem; }
        .msg.user { background: #2563eb; align-self: flex-end; }
        .msg.verity { background: #334155; align-self: flex-start; border-left: 4px solid var(--yellow); }

        .input-bar { padding: 1rem; background: #0f172a; display: flex; gap: 0.5rem; border-top: 1px solid var(--border); }
        .input-bar input { flex: 1; padding: 0.8rem 1rem; background: #1e293b; border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; }
        .input-bar button { background: var(--yellow); color: #000; border: none; padding: 0.8rem 1.5rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .input-bar button:hover { opacity: 0.9; }

        footer { text-align: center; padding: 1rem; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

<nav>
    <h2>Verity AI Console</h2>
    <a href="index.html">&larr; Kembali ke Lobby</a>
</nav>

<div class="main-container">
    <!-- Panel Kiri: Avatar & Form API Key -->
    <div class="sidebar">
        <h3 style="color: var(--yellow);">Entitas Verity</h3>
        <div class="avatar-container">
            <img src="verity-avatar.jpg" alt="Verity Avatar" id="avatar" class="avatar-img">
        </div>
        <p id="status-text" style="color: #94a3b8; font-size: 0.85rem;">Status: Standby</p>

        <div class="config-box">
            <h4>Konfigurasi Fish Audio</h4>
            
            <label>API Key Fish Audio:</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">

            <label>Reference ID (Verity ID):</label>
            <input type="text" id="voiceIdInput" placeholder="ID Suara dari Fish Audio">
        </div>
    </div>

    <!-- Panel Kanan: Custom Chat Console -->
    <div class="chat-area">
        <div class="chat-header">
            <span>Verity Console & Voice TTS</span>
            <span style="color: var(--cyan);">Powered by Fish Audio API</span>
        </div>
        <div class="messages" id="chatBox">
            <div class="msg verity">Halo! Saya Verity, teman pembantu pribadimu. Tanya saya apa saja, saya tahu semuanya!</div>
        </div>
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Ketik pesan untuk Verity..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>
</div>

<footer>
    Verity AI Project &bull; Compatible with GitHub Pages
</footer>

<script>
    // =========================================================================
    // ⚙️ TARO API KEY & VERITY ID FISH AUDIO KAMU DI SINI:
    // =========================================================================
    const CONFIG = {
        API_KEY: "sk-fish-ZHF9Zri4axcUOo_P7l0nzYznfuUPuUe1qTKQevSqE4o",   // Contoh: sk-...
        MODEL_ID: "5899eeffecac441d9c5072436785e472" // ID Model Verity dari Fish Audio
    };
    // =========================================================================

    // Masukkan data dari CONFIG ke input box secara otomatis saat dibuka
    document.addEventListener("DOMContentLoaded", () => {
        if (CONFIG.API_KEY && CONFIG.API_KEY !== "TARO_API_KEY_FISH_AUDIO_DI_SINI") {
            document.getElementById('apiKeyInput').value = CONFIG.API_KEY;
        }
        if (CONFIG.MODEL_ID && CONFIG.MODEL_ID !== "TARO_ID_VERITY_FISH_AUDIO_DI_SINI") {
            document.getElementById('voiceIdInput').value = CONFIG.MODEL_ID;
        }
    });

    // FUNGSI CHAT + TERJEMAHAN SUARA FISH AUDIO
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const apiKey = document.getElementById('apiKeyInput').value.trim() || CONFIG.API_KEY;
        const referenceId = document.getElementById('voiceIdInput').value.trim() || CONFIG.MODEL_ID;
        const avatar = document.getElementById('avatar');
        const statusText = document.getElementById('status-text');

        if (!text) return;

        // 1. Tampilkan pesan User
        appendMessage(text, 'user');
        input.value = '';

        // 2. Simulasi Respon Verity AI
        const verityReply = `Saya Verity! Kamu tadi bilang: "${text}". Aku tahu segalanya!`;
        appendMessage(verityReply, 'verity');

        // 3. Panggil API Fish Audio jika Key & ID terisi
        if (apiKey && referenceId && apiKey !== "TARO_API_KEY_FISH_AUDIO_DI_SINI") {
            statusText.innerText = "Status: Mengambil Suara Verity...";
            try {
                const response = await fetch("https://api.fish.audio/v1/tts", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "model": "s2.1-pro-free"
                    },
                    body: JSON.stringify({
                        text: verityReply,
                        reference_id: referenceId,
                        format: "mp3"
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Error ${response.status}: ${errText}`);
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);

                // Efek animasi avatar saat suara diputar
                avatar.classList.add('speaking');
                statusText.innerText = "Status: Berbicara...";

                audio.play();
                audio.onended = () => {
                    avatar.classList.remove('speaking');
                    statusText.innerText = "Status: Standby";
                };
            } catch (err) {
                console.error(err);
                statusText.innerText = "Status: Error (Cek Console F12)";
            }
        } else {
            statusText.innerText = "Status: Mode Teks (Isi API Key & ID Dulu)";
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
  </html>
