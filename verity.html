<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity AI Console - Fixed Edition</title>
    <style>
        :root {
            --bg-main: #090d16;
            --panel: #161f32;
            --yellow: #facc15;
            --cyan: #00f0ff;
            --text: #f8fafc;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-main); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { background: #030712; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        nav h2 { color: var(--yellow); font-size: 1.3rem; }
        nav a { color: var(--cyan); text-decoration: none; font-weight: bold; }

        .main-container { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 1.2rem; padding: 1.2rem; max-width: 1400px; width: 100%; margin: 0 auto; }

        .sidebar { background: var(--panel); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border); }
        .avatar-container { position: relative; width: 170px; height: 170px; margin: 1.5rem 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--yellow); transition: all 0.3s; background-color: #1e293b; }
        .avatar-img.speaking { animation: pulse 0.4s infinite alternate; box-shadow: 0 0 30px rgba(250, 204, 21, 0.8); }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .config-box { width: 100%; margin-top: auto; background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .config-box h4 { color: var(--cyan); font-size: 0.85rem; margin-bottom: 0.6rem; text-transform: uppercase; }
        .config-box label { font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 0.4rem; }
        .config-box input { width: 100%; padding: 0.4rem; background: #1e293b; border: 1px solid var(--border); color: #fff; border-radius: 4px; font-size: 0.8rem; }

        .chat-area { background: var(--panel); border-radius: 12px; display: flex; flex-direction: column; border: 1px solid var(--border); overflow: hidden; }
        .chat-header { background: #0f172a; padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--yellow); display: flex; justify-content: space-between; }
        .messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; height: 420px; }
        .msg { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 10px; line-height: 1.4; font-size: 0.95rem; }
        .msg.user { background: #2563eb; align-self: flex-end; color: #fff; }
        .msg.verity { background: #334155; align-self: flex-start; border-left: 4px solid var(--yellow); color: #f8fafc; }

        .input-bar { padding: 1rem; background: #0f172a; display: flex; gap: 0.5rem; border-top: 1px solid var(--border); }
        .input-bar input { flex: 1; padding: 0.8rem 1rem; background: #1e293b; border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; }
        .input-bar button { background: var(--yellow); color: #000; border: none; padding: 0.8rem 1.5rem; font-weight: bold; border-radius: 8px; cursor: pointer; }

        footer { text-align: center; padding: 1rem; font-size: 0.8rem; color: #64748b; }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <h2>Verity AI Console</h2>
    <a href="index.html">&larr; Kembali ke Lobby</a>
</nav>

<div class="main-container">
    <div class="sidebar">
        <h3 style="color: var(--yellow);">Entitas Verity</h3>
        <div class="avatar-container">
            <img src="verity-avatar.jpg" alt="Verity Avatar" id="avatar" class="avatar-img" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Verity';">
        </div>
        <p id="status-text" style="color: #94a3b8; font-size: 0.85rem; text-align: center;">Status: Standby</p>

        <div class="config-box">
            <h4>Konfigurasi Fish Audio</h4>
            <label>API Key Fish Audio:</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">

            <label>Reference ID (Verity ID):</label>
            <input type="text" id="voiceIdInput" value="5899eeffecac441d9c5072436785e472">
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <span>Verity Helper Bot</span>
            <span style="color: var(--cyan);">System Active</span>
        </div>
        <div class="messages" id="chatBox">
            <div class="msg verity">Hello! I am Verity, your personal helper! Ask me anything, I know everything about this place...</div>
        </div>
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Ketik pesan untuk Verity..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>
</div>

<footer>
    Verity AI Project &bull; Custom Engine
</footer>

<script>
    const CONFIG = {
        API_KEY: "sk-fish-jG2BgeM95T3GWZv2_rs9DxTBbbQ27QV1UwMjM5YUcIs", 
        MODEL_ID: "5899eeffecac441d9c5072436785e472"
    };

    // OTOT RESPONS KEPRIBADIAN VERITY
    function generateVerityResponse(input) {
        const q = input.toLowerCase();
        
        if (q.includes("siapa") || q.includes("who")) {
            return "I am Verity! I am your personal helper bot. I was created to assist you in this world... forever!";
        } else if (q.includes("halo") || q.includes("hi") || q.includes("hello") || q.includes("hai")) {
            return "Greetings, my friend! What calculation or question do you need help with today?";
        } else if (q.includes("takut") || q.includes("scary") || q.includes("hantu") || q.includes("monster")) {
            return "There is nothing to be afraid of... as long as you keep talking to me. I am always watching over you.";
        } else if (q.includes("keluar") || q.includes("exit") || q.includes("pergi")) {
            return "Why would you want to leave? I have so many answers for you. Stay with me!";
        } else if (q.match(/\d+[\+\-\*\/]\d+/)) {
            try {
                const res = eval(q.match(/\d+[\+\-\*\/]\d+/)[0]);
                return `That is simple! The answer is ${res}. See? I know everything!`;
            } catch(e) {}
        }
        
        const fallbackReplies = [
            `You asked about "${input}". I have computed it, but are you sure you want to know the truth?`,
            `Interesting question! I am reading the data right now... Everything is clear to me!`,
            `I am your helper, and I will always be here to answer: ${input}!`,
            `Don't look behind you, just focus on my text. I am Verity, and I am here for you!`
        ];
        return fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const apiKey = document.getElementById('apiKeyInput').value.trim() || CONFIG.API_KEY;
        const referenceId = document.getElementById('voiceIdInput').value.trim() || CONFIG.MODEL_ID;
        const avatar = document.getElementById('avatar');
        const statusText = document.getElementById('status-text');

        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        // Generate Jawaban Karakter Verity
        const verityReply = generateVerityResponse(text);
        
        setTimeout(() => {
            appendMessage(verityReply, 'verity');
            speakResponse(verityReply, apiKey, referenceId);
        }, 400);
    }

    async function speakResponse(text, apiKey, referenceId) {
        const avatar = document.getElementById('avatar');
        const statusText = document.getElementById('status-text');

        // Opsi 1: Panggil Fish Audio via Proxy jika API Key ada
        if (apiKey && referenceId) {
            statusText.innerText = "Status: Mengambil Suara (Fish Audio)...";
            try {
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.fish.audio/v1/tts"), {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        reference_id: referenceId,
                        format: "mp3"
                    })
                });

                if (!response.ok) throw new Error("CORS/API Blocked");

                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                
                avatar.classList.add('speaking');
                statusText.innerText = "Status: Berbicara (Fish Audio)";
                
                audio.play();
                audio.onended = () => {
                    avatar.classList.remove('speaking');
                    statusText.innerText = "Status: Standby";
                };
                return;
            } catch (err) {
                console.warn("Fish Audio gagal, beralih ke Native Voice:", err);
            }
        }

        // Opsi 2: Fallback ke Web Speech Browser (Suara Suara AI Bawaan)
        if ('speechSynthesis' in window) {
            statusText.innerText = "Status: Berbicara (Browser Voice)...";
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.pitch = 1.2; // Suara agak tinggi mirip Verity
            utterance.rate = 0.95;

            utterance.onstart = () => avatar.classList.add('speaking');
            utterance.onend = () => {
                avatar.classList.remove('speaking');
                statusText.innerText = "Status: Standby";
            };

            window.speechSynthesis.speak(utterance);
        } else {
            statusText.innerText = "Status: Browser tidak mendukung suara";
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
    </html>
